[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[project]
name = "quantibbler"
version = "0.1.0"
description = "Sub-1-bit LLM quantization (compressor) with a pure-Rust OpenAI-compatible server for compressed models."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "donicrosby" }]
dependencies = ["numpy>=2.4,<3"]

[project.optional-dependencies]
torch = ["torch>=2.13,<3"]
kernels = ["quantibbler-kernels==0.1.0"]
# Model-development loop (tools/quantize_hf_model.py): load HF causal LMs
# (transformers + tokenizers + safetensors weights) and read the wikitext-2
# calibration/eval parquet shards (pyarrow). HF_HUB_OFFLINE=1 is enforced by
# the driver; models ride the local HF cache.
hf = [
    "transformers>=4.51,<6",
    "tokenizers>=0.21,<1",
    "safetensors>=0.5,<2",
    "pyarrow>=18,<24",
]

[dependency-groups]
# pyyaml is a TEST-harness dependency, not a product one: tests/test_ci_referee.py
# parses .github/workflows/ci.yml with `yaml.safe_load` and asserts on the parsed
# job/step structure, so no spelling of a key (`if:`, `'if':`, `if :`) can escape
# the pin and blank lines are the parser's problem rather than the matcher's. The
# lean CI leg installs it explicitly for the same reason — see that job's recipe.
dev = ["pytest>=9,<10", "pytest-xdist>=3.6,<4", "pre-commit>=4.6,<5", "maturin>=1.14,<2", "pyyaml>=6,<7"]

[tool.uv]
required-version = ">=0.12"

[tool.uv.workspace]
members = ["crates/quantibbler-kernels"]

[tool.uv.sources]
quantibbler-kernels = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# tools/*.py are executable scripts (the model-development loop, fixture
# generators): they must set sys.path / env BEFORE importing the package,
# which is exactly what E402 flags.
"tools/*.py" = ["E402"]
