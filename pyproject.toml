[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[project]
name = "quantibbler"
version = "0.1.0"
description = "Sub-1-bit LLM quantization (compressor) with a pure-Rust OpenAI-compatible server for compressed models."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "donicrosby" }]
dependencies = ["numpy>=2.4,<3"]

[project.optional-dependencies]
torch = ["torch>=2.13,<3"]
kernels = ["quantibbler-kernels==0.1.0"]

[dependency-groups]
dev = ["pytest>=9,<10", "pre-commit>=4.6,<5", "maturin>=1.14,<2"]

[tool.uv]
required-version = ">=0.12"

[tool.uv.workspace]
members = ["crates/quantibbler-kernels"]

[tool.uv.sources]
quantibbler-kernels = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
