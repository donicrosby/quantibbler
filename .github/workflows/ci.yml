# The repo's first independent referee: six jobs on every pull request and every
# push to main, plus one self-seeding weights job.
#
# Why the shapes below are what they are:
#   * `pull_request` + `push: [main]`, never `pull_request_target` — the workflow
#     executes only content already at the head it runs on, so it adds no
#     PR-content execution surface, and this repo's direct-push landing practice
#     still gets refereed.
#   * No secrets, anywhere, and `permissions: contents: read` — the PR-run attack
#     surface is secret-free by construction, not by discipline.
#   * Every third-party action is pinned by full commit SHA, resolved against the
#     pinned repo's head when this workflow was authored (see the per-line
#     comments for repo + release provenance). Never a tag, never a branch.
#   * `defaults.run.shell` puts every shell step under `bash -euo pipefail`
#     structurally — a step cannot forget it — so a green filtered tail can never
#     mask a red gate.
#   * Every command body below has been executed locally in the sandbox and its
#     real output recorded in openspec/changes/qk-ci-referee/tasks.md. The YAML
#     contains no command that has never been run.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# One suite at a time: a new push to main cancels the still-running run for the
# previous push instead of stacking half-hour suites behind it. Nightly-queue
# churn from rapid landing cadence is worse than a cancelled superseded run —
# every cancelled commit is either superseded on main or re-landed with a
# fresh run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

env:
  UV_VERSION: "0.12.5"
  OPENSPEC_VERSION: "1.14.3"
  HF_HUB_VERSION: "2.2.0"
  # The seeded weights cache. Pinned to the checkpoint repo + revision and the
  # dataset repo + revision the abort leg's tooling asserts
  # (tools/ci/abort_leg.py::PINNED_REVISIONS — a test pins the two together).
  # A revision bump = a new key suffix, verified by the seed job before it saves.
  HF_CACHE_KEY: hf-abort-leg-qwen3-0.6b-c1899de289a04d12100db370d81485cdf75e47ca-wikitext-b08601e04326c79dfdd32d625aee71d232d685c3-v1

jobs:
  product-floor:
    name: product floor (the shipped deps install and import; the harness is not in the product)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # astral-sh/setup-uv v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      # product_floor_carries_the_pipeline: a fresh venv from the project's OWN
      # dependency set. `uv pip install -e .` installs the declared
      # dependencies only — no optional dependency (extra) and no dependency
      # group rides along — which is the whole assertion: the PTQ pipeline IS
      # the product, so torch/transformers/tokenizers/safetensors/pyarrow must
      # be importable from the shipped set, and the test harness must not be in
      # it. Deliberately NOT `--locked` and not `uv sync`: this leg floats on
      # purpose, because "does the shipped dependency set still install and
      # import" is its signal. Do not "fix" it into determinism.
      - name: Build the floor interpreter (uv venv + the project's own dependencies)
        run: |
          rm -rf .venv-floor
          uv venv --python 3.12 .venv-floor
          VIRTUAL_ENV="$PWD/.venv-floor" uv pip install -e .
      - name: Prove the product's own lane imports from the floor alone
        run: |
          .venv-floor/bin/python -c "import numpy, torch, transformers, tokenizers, safetensors, pyarrow; print('product floor imports:', torch.__version__, transformers.__version__)"
      # dev_tooling_is_not_product: the suite's harness must NOT be part of the
      # product's declared dependency set. Nothing here may be soft-gated
      # either — the ptq tier's skip-when-absent hook is deleted, so a missing
      # product dep is a sync error that fails loudly at collection rather than
      # a green suite with a hole in it.
      - name: Prove the dev/test harness is absent from the floor
        run: |
          if .venv-floor/bin/python -c "import pytest, yaml"; then
            echo "::error::the product floor can import pytest/pyyaml - the test harness leaked into the product's own dependency set"
            exit 1
          fi
          echo "harness absent: pytest and PyYAML are not importable from the product floor"

  full-python:
    name: full python (the locked dev environment, zero skips)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # astral-sh/setup-uv v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Sync the project (the product's own deps + the default dev group; locked)
        run: uv sync --locked
      # This is the job that refuses every "green suite with a hole": a skipped
      # ptq tier is a hole, and the summary line is parsed, not eyeballed.
      - name: pytest (full suite) and the zero-skip assertion
        run: |
          if uv run --no-sync pytest --color=no -q -rs > pytest-full.log 2>&1; then rc=0; else rc=$?; fi
          cat pytest-full.log
          uv run --no-sync python tools/ci/pytest_summary.py \
            --log pytest-full.log --pytest-rc "$rc" --expect-skipped 0

  rust-kernels:
    name: rust kernels (test, clippy -D warnings, fmt, maturin build)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      MANIFEST: crates/quantibbler-kernels/Cargo.toml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      # dtolnay/rust-toolchain publishes no release tags; the moving `v1` tag was
      # resolved to this commit when the workflow was authored. The toolchain
      # version is the one every rust gate below was rehearsed with (the crate's
      # MSRV is documented separately in AGENTS.md / openspec config).
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # dtolnay/rust-toolchain v1
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - name: cargo test
        # Package selection is explicit rather than `--manifest-path`-scoped:
        # `crates/quantibbler-server` carries the two purity guards
        # (`binary_purity.rs`: no libpython in the served binary;
        # `cubek_purity.rs`: cubek-attention reachable under `gpu`,
        # `cpu-reference` never enabled), and a manifest-path selection of the
        # kernels crate alone never executes them — a guard nothing runs is
        # decoration. Measured: a deliberately failing test in
        # `crates/quantibbler-server/tests/cubek_purity.rs` is invisible to the
        # manifest-path form and red (rc=101) under this one.
        run: cargo test --locked -p quantibbler-kernels -p quantibbler-server --all-targets
      - name: cargo clippy -D warnings
        run: cargo clippy --locked -p quantibbler-kernels -p quantibbler-server --all-targets -- -D warnings
      - name: cargo fmt --check
        run: cargo fmt --manifest-path "$MANIFEST" --all -- --check
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # astral-sh/setup-uv v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: maturin build (the wheel the Python face ships from)
        run: uv run --locked maturin build --manifest-path "$MANIFEST"

  openspec:
    name: openspec (every active change, strict, one id per invocation)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - name: node and npx are present
        run: |
          node --version
          npx --version
      # One id per invocation, never a two-argument or silent-skip form. The CLI
      # version is pinned to the semantics this repo's config.yaml was authored
      # against, and a failed install fails the job instead of validating
      # nothing. An empty glob is a failure, not a green: a referee that checks
      # zero changes has proved nothing.
      - name: validate every active change dir strictly
        run: |
          validated=0
          for dir in openspec/changes/*/; do
            id="$(basename "$dir")"
            if [ "$id" = "archive" ]; then
              continue
            fi
            echo "== openspec validate $id --strict"
            npx --yes "@fission-ai/openspec@${OPENSPEC_VERSION}" validate "$id" --strict
            validated=$((validated + 1))
          done
          if [ "$validated" -eq 0 ]; then
            echo "::error::no active openspec change was validated - the glob matched nothing"
            exit 1
          fi
          echo "validated $validated active change(s) strictly"

  driver-smoke:
    name: driver smoke (plumbing only, offline tiny fixture)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # astral-sh/setup-uv v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Sync the project the driver needs (locked)
        run: uv sync --locked
      # Plumbing-only by measurement: the random-init fixture's next-token
      # distribution is already uniform (rank-1 quantized ratio 1.0000006; a
      # zeroed o_proj moves its PPL by 3 ppm), so this job proves the gate's code
      # path executes end-to-end and that the report and the exit code agree. It
      # makes no detection and no abort-path claim - those are the abort leg's.
      # The invocation list in the tool names `--device cpu` explicitly:
      # `--device auto` means "the accelerator or refuse" (the fail-closed
      # default) and this runner has none. Measured before that flag: exit 1 at
      # the refusal and "no quantize_report.json was written", so the leg could
      # not referee the gate it exists to referee.
      - name: driver smoke on the tiny offline fixture
        run: |
          uv run --no-sync python tools/ci/driver_smoke.py --out "$RUNNER_TEMP/smoke-out"

  abort-leg:
    name: abort leg (real checkpoint, weights cached, offline)
    # The seed job is never skipped, so this dependency can never inherit a
    # condition-skip (a `needs:` on a skipped job would silently turn the leg
    # into a green no-run). On a run with a cold cache it waits for the seed's
    # one download; on a hit the seed is a no-op and this proceeds at once.
    #
    # timeout-minutes: sized against the leg's recorded CONTENTION worst case,
    # not its quiet baseline (abort before block 3 on a minimal-shape run:
    # rank 1, 1 ADMM iter, seq 64, 8 cal seqs — ~60s). A three-way runner wave
    # has driven that same command to 2573s (~43 min) with the abort still
    # bit-identical; the in-script 3600s ceiling exists to clear that, and a
    # 15-minute fence fires first on exactly those contended-but-correct runs,
    # leaving the in-script backstop unreachable.
    # 65 minutes = 3900s = 1.52x the recorded 2573s worst and 65x the quiet
    # baseline, deliberately ABOVE the in-script 3600s ceiling so that ceiling
    # stays reachable: a true hang is caught and reported by the in-script
    # wall/timeout checks, and this fence is only the outer net for a hang
    # before the driver starts (checkout + sync + cache restore run ~1-2 min
    # ahead of the driver, so the in-script kill lands ~3720s on the job clock,
    # still ~180s inside this fence).
    # Accepted trade: a hung leg occupies a hosted
    # runner for up to ~65 minutes instead of 15; a contended-but-correct run
    # finishes instead of being cancelled.
    timeout-minutes: 65
    needs: seed-weights
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # astral-sh/setup-uv v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Sync the project the driver needs (locked)
        run: uv sync --locked
      # fail-on-cache-miss: a cold cache fails the job. Never a silent live
      # download - that would make the leg network-dependent and let a miss pass
      # quietly, which is the disease this repo just burned.
      - name: Restore the seeded weights cache (fail closed on a miss)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # actions/cache v6.1.0
        with:
          path: hf-cache
          key: ${{ env.HF_CACHE_KEY }}
          fail-on-cache-miss: true
      # The recorded abort command, executed offline, with the abort asserted
      # from the real process: abort before block 3, wall time inside the 3600s
      # contention-immune backstop (quiet baseline ≈60s — catches hangs and
      # gross regressions, not an abort-latency contract; the job fence above
      # sits past this ceiling so this backstop stays reachable), status failed +
      # probe_abort fields + the trajectory so far, nonzero exit.
      # Its invocation list also names `--device cpu` (see tools/ci/abort_leg.py):
      # the recorded run this leg cites was itself a CPU run under CI, and
      # `--device auto` is fail-closed on the accelerator-less runner.
      - name: run the recorded abort command and assert the abort
        run: |
          uv run --no-sync python tools/ci/abort_leg.py \
            --cache "$PWD/hf-cache" --out "$RUNNER_TEMP/abort-out"

  seed-weights:
    name: seed the weights cache (self-seeding, the one network-allowed job)
    # Never skippable: this job runs on ALL three triggers and the abort leg
    # `needs:` it, so a job-level `if` would let a condition-skip propagate into
    # the leg and quietly turn a real run into a green no-run. The no-PR-content
    # property therefore lives at STEP level: the fetch and save steps carry
    # `github.event_name != 'pull_request'`, and the lookup-only restore below is
    # unconditional so a PR run can READ main's cache but can never write one.
    # On a push (or dispatch) with a cold cache this fetches the pinned snapshots
    # once and saves them; on a hit it is a pure no-op.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # astral-sh/setup-uv v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      # Idempotency gate: a dispatch of an already-seeded key is a GREEN no-op
      # instead of a red "cache already exists" at the save step (re-warming is a
      # routine operation — orchestrator task 9 may run it more than once before
      # the first green). lookup-only reads the cache index without downloading.
      - name: Is this key already seeded?
        id: seeded
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # actions/cache v6.1.0
        with:
          path: hf-cache
          key: ${{ env.HF_CACHE_KEY }}
          lookup-only: true
      - name: Fetch the pinned snapshots (live network here and only here)
        if: steps.seeded.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        run: |
          uvx --from "huggingface-hub==${HF_HUB_VERSION}" hf download Qwen/Qwen3-0.6B \
            --revision c1899de289a04d12100db370d81485cdf75e47ca --cache-dir "$PWD/hf-cache"
          uvx --from "huggingface-hub==${HF_HUB_VERSION}" hf download Salesforce/wikitext \
            --revision b08601e04326c79dfdd32d625aee71d232d685c3 \
            --repo-type dataset --include "wikitext-2-raw-v1/*" --cache-dir "$PWD/hf-cache"
          du -sh hf-cache
          # The fetch is pinned to the same revisions the cache key names, so this
          # loop is VERIFICATION, not detection: a miss means an upstream
          # force-push or a fetch that lost its pin, and the recovery is bumping
          # the pins and the key suffix together.
          #
          # It also restores the branch ref. A revision-pinned fetch writes
          # snapshots/<sha>/ but NO refs/, and the driver resolves
          # `--model Qwen/Qwen3-0.6B` offline THROUGH refs/main — measured: the
          # revision-pinned cache alone would leave the abort leg unable to resolve
          # the repo id. refs/main holds the bare 40-char sha, no newline, exactly
          # as a branch fetch writes it.
          for pair in \
            "models--Qwen--Qwen3-0.6B:c1899de289a04d12100db370d81485cdf75e47ca" \
            "datasets--Salesforce--wikitext:b08601e04326c79dfdd32d625aee71d232d685c3"; do
            repo_dir="${pair%%:*}"
            revision="${pair##*:}"
            snapshot="hf-cache/$repo_dir/snapshots/$revision"
            if [ ! -d "$snapshot" ]; then
              echo "::error::the pinned fetch produced no $snapshot - upstream force-pushed this revision, or the fetch lost its pin; bump the pins and the key suffix together"
              exit 1
            fi
            mkdir -p "hf-cache/$repo_dir/refs"
            printf '%s' "$revision" > "hf-cache/$repo_dir/refs/main"
            echo "seeded $snapshot (refs/main -> $revision)"
          done
      - name: Already seeded at this key
        if: steps.seeded.outputs.cache-hit == 'true'
        run: |
          echo "already seeded at $HF_CACHE_KEY - nothing to fetch, nothing to save"
          echo "re-warm (after cache eviction) means: bump the key suffix and the pinned revisions together"
      - name: Save the weights cache
        if: steps.seeded.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # actions/cache v6.1.0
        with:
          path: hf-cache
          key: ${{ env.HF_CACHE_KEY }}
