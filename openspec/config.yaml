project: quantibbler
schema: spec-driven

context: |
  # quantibbler

  Sub-1-bit LLM weight quantization via latent binary factorization:
  a Python compressor that produces quantized models, and a pure-Rust
  inference server that serves them.

  ## Component decomposition (do not violate)

  - `quantibbler` (Python, `src/quantibbler/`) — the COMPRESSOR/TRAINER.
    PTQ pipeline (later: QAT). Produces qpk1 artifacts. It must never
    gain HTTP/server dependencies, inference-serving code, or network
    access; model and calibration data are caller-supplied.
  - `quantibbler-server` (pure Rust, `crates/quantibbler-server/`) — the
    SERVING component, in the llama.cpp / vLLM shape: an OpenAI-compatible
    HTTP API (`/v1/chat/completions`, `/v1/completions`, `/v1/models`,
    `/health`) that loads qpk1 model directories from local paths or
    network-volume mounts and serves token streaming. Pure Rust: tokio +
    axum; tokenizers crate for BPE. No Python dependency, no embedded
    interpreter, ever.
  - `quantibbler-kernels` (Rust, `crates/quantibbler-kernels/`) — ONE
    kernel implementation, TWO consumers: the server links the rlib
    directly; Python binds the same code through a PyO3 face of the same
    crate. Kernel behavior is identical on both sides by construction —
    the Python side consumes the server's kernels for any quantized-side
    inference (parity probes, pipeline gates); it does not reimplement
    kernels in torch or NumPy.
  - NumPy reference implementations in `src/quantibbler/kernels/` remain
    the executable specification (they define correct behavior and run
    where the extension is absent); the Rust kernels must match them on
    float64 within 1e-12 relative tolerance on every probe test, and the
    parity probes run the SAME fixture through both faces.
  - Interchange between the two halves is the qpk1 container ONLY. The
    server reads what the compressor writes, nothing else.
  - A C/C++/Cython/CUDA-C++ dependency is BANNED anywhere in the build graph
    of either component (runtime or test). If systems speed is needed, it is
    Rust. This rule extends to optional extras and test tooling.
  - Supported Python: 3.11-3.13 (numpy 2.4+ dropped 3.10; 3.10 EOL Oct 2026).
    Rust MSRV: 1.85 (edition 2024).
  - Dependency classification (ruling 2026-10-25): an extra is strictly for a
    part of the program a product user does NOT need. The PTQ pipeline IS the
    product, so torch, transformers, tokenizers, safetensors and pyarrow are
    the product's own `[project].dependencies` — never an extra, never a
    dev-group-only home (the run images install the product with
    `uv sync --no-dev --all-extras` and assert its imports; `pip install
    quantibbler` must yield a working compressor). `kernels` is the one extra
    that qualifies: the NumPy references in `src/quantibbler/kernels/` are the
    executable specification and run where the Rust extension is absent. A
    dependency the suite needs is a HARD one — a missing needed dep is a sync
    error that fails loudly at collection, never an ignored/skipped tier.
  - Dependency freshness: every declared dependency requirement must be
    within ONE major version of the latest stable release; for 0.x
    packages, within ONE minor version. Verify against the live registry
    (PyPI / crates.io) whenever adding or bumping a requirement — never
    guess a floor from memory.

  ## GPU policy

  - Compressor/trainer: PyTorch (training and QAT autograd).
  - Rust kernels: CPU-only in v0.1 on BOTH faces (server and PyO3).
  - Server compute substrate for quantized inference is a design decision
    for the serving change: start CPU-native packed kernels; evaluate
    candle (0.11, updated 2026-06, actively maintained) or mistral.rs
    (0.8.1, updated 2026-04) as the GPU substrate ONLY with registry
    evidence and a profile showing CPU leaves material performance
    unclaimed. Abandoned crates are never adopted.
  - For the kernels' own GPU face, the leading candidate is CubeCL
    (tracel-ai/cubecl, MIT/Apache-2.0): kernel-authoring framework —
    Rust source compiled to CUDA / HIP-ROCm / Metal / wgpu / CPU(LLVM).
    Registry evidence 2026-10-17: v0.11.0 (2026-10-06), repo pushed
    2026-10-16, 681k recent downloads. Rationale: one kernel source
    covers NVIDIA rental GPUs AND AMD ROCm homelab hardware; the CPU
    backend allows cargo-test parity probes without a GPU. Cautions:
    0.x API churn (four pre-releases preceded 0.11) and JIT
    first-run compilation cost in server contexts. Adopt only for a
    profile-justified GPU lane, pinned per the freshness rule, with
    backend-parity probes (packed bits identical across CUDA/HIP/CPU
    runs; float64 rel 1e-12 vs the NumPy reference).

  ## Method invariants (from the pinned papers in docs/papers/)

  - The only authoritative references are the papers pinned in docs/papers/.
    Cite them by paper key and section: [LB] = littlebit-2506.13771v5,
    [NQ] = nanoquant-2602.06694v3, [LB2] = littlebit2-2603.00042v2,
    [FA] = flashattention-2205.14135v2 (tiled exact attention, pinned
    2026-10-18), [SA] = sageattention-2410.02367v9 (INT8 attention,
    pinned 2026-10-18).
  - The shared weight representation is W ~= diag(s1) @ (Ub @ Vb^T) @ diag(s2)
    with binary factors Ub in {-1,+1}^(dout x r), Vb in {-1,+1}^(din x r)
    and full-precision scale vectors s1, s2 ([NQ] Sec 3.1; [LB] W_hat_pri
    with the latent scale l folded into the factors). Storage must be
    dominated by packed binary bits: effective BPW is counted from
    serialized bytes, never from parameter counts.
  - NQ path (PTQ): ADMM-based initialization of (Ub, Vb, s1, s2) with
    Hessian-aware coupling, then block-wise reconstruction, then global
    scale calibration ([NQ] Sec 3).
  - LB path (QAT): SVD init (Dual-SVID) or Joint-ITQ init ([LB2]), sign
    estimation with Straight-Through Estimator, multi-scale compensation,
    knowledge distillation from the fp32 teacher ([LB] Sec 3).
  - Numerics: solvers compute in bf16 by default; float32 and float64 are
    selectable non-defaults. One declared compute dtype flows through every
    stage — widening to an accumulation dtype is an explicit per-site
    declaration, never a silent upcast.
  - No network access at runtime; model and calibration data are user
    supplied. Downloading models is the caller's job (documented, not built).

  ## Verification gates (every implementation change runs them)

  - cargo test + cargo clippy --all-targets -D warnings + cargo fmt --check
    for the kernels crate; pytest for the Python package; maturin build for
    the wheel. All must pass before a change lands.
  - Correctness probes: Rust kernel output vs NumPy reference (rel 1e-12,
    float64) and a sign-agreement invariant (packed bits identical).
  - End-to-end smoke: tiny random transformer block, quantize -> serialize
    -> reload -> forward, max logit delta bounded, BPW measured from bytes.

  ## Evidence hierarchy for design decisions

  1. Papers pinned in docs/papers/ (cite section/equation).
  2. Explicitly-marked "informed assumption" in design.md, with rationale.
  Never consult any other implementation source. Papers carry hyperlinks
  only to arXiv; if you find yourself looking for a repository, stop and
  cite the paper instead.

rules:
  proposal:
    - "Include a Non-goals section; name what this change deliberately does not do."
    - "Every method-design claim cites a paper key and section, or is flagged 'informed assumption' with rationale."
    - "Any change touching the kernels contract or the storage format is marked invariant-touching and states the compatibility impact."
  design:
    - "List discarded alternatives with the reason each was discarded."
    - "Record every Open Question with status; unresolved questions name their owner."
    - "Informed assumptions are listed in one section, each with rationale and how a wrong assumption would surface."
  tasks:
    - "Each task is independently verifiable with a command and expected outcome."
    - "Tests precede implementation per capability (test names reference scenario IDs)."
    - "Last task is always: run the full gate suite (pytest, cargo test, clippy -D warnings, fmt --check, maturin build) and record results."
    - "Every task maps to a ticket on the quantibbler kanban board assigned to its role profile (coder/planner/bug-hunter/sec-eng; orchestrator tasks go to default), carrying definition-of-done and success criteria on top of this change; the ticket body points at the change dir, it never rewrites it."
    - "Fire-bearing tasks (production or real-model runs) are ticketed as HOLD at low priority and launch only on explicit @user GO; no ticket self-authorizes a run, and lane status changes are @user's call alone."
