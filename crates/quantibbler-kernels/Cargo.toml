[package]
name = "quantibbler-kernels"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Rust kernels for quantibbler sub-1-bit quantization"

[lib]
name = "quantibbler_kernels"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]
gpu = ["dep:cubecl", "dep:cubek-attention"]
fast-cpu = ["dep:wide", "dep:rayon"]
# Third parity face (change qk-flash-attention task 2.3): cubek's OWN naive
# CPU reference implementation, run against our NumPy reference on the shared
# fixture battery — two independent implementations agreeing is the strongest
# available guard against a shared misreading of the conventions. It is a
# separate OPT-IN feature (not `gpu`) on purpose: the reference path needs no
# device, and keeping it off the default build keeps cubecl's test/CPU support
# crates out of the shipped graph entirely. `cubek-test-utils` rides as an
# optional dependency with it (its `HostData` is the reference's data carrier),
# so nothing extra is built or locked unless this face is explicitly asked for.
cubek-cpu-reference = ["dep:cubecl-ref", "cubek-attention/cpu-reference", "dep:cubek-test-utils"]
default = []

[dependencies]
pyo3 = { version = "0.30", features = ["abi3-py311"] }
numpy = "0.30"
nalgebra = "0.34.2"
# bf16 for the dtype-generic product surface (change qk-kernels-dtype-generic,
# design D3). Pure Rust, no C dependency, already in the workspace lock graph
# via the tokenizers toolchain; 2.7 is the current stable 2.x line.
half = "2.7"
cubecl = { version = "0.11.0", features = ["hip"], optional = true }
# The adopted attention substrate (change qk-flash-attention, design.md
# "Substrate decision 2026-10-19"): cubek-attention 0.3.0 on the same
# cubecl 0.11 line. `default-features = false` keeps `cubecl/default` (and
# its cuda/wgpu/metal backends) out of our HIP-only build; `std` is what the
# launcher actually needs.
cubek-attention = { version = "0.3.0", default-features = false, features = ["std"], optional = true }
# Only reachable through the opt-in `cubek-cpu-reference` feature (task 2.3):
# cubek's CPU reference hands results back in this crate's `HostData`. Optional
# on purpose — a default build must not pay for it.
cubek-test-utils = { version = "0.3.0", optional = true, default-features = false, features = ["std"] }
# The third parity face's own cubecl edge: same crate and version as the `gpu`
# face's, but WITHOUT the `hip` feature our gpu line declares — so the face
# compiles with no ROCm toolchain. Cargo unifies both edges onto one cubecl, so
# `gpu` still gets its HIP backend while `cubek-cpu-reference` alone resolves
# hip-free: measured with `cargo tree -p quantibbler-kernels --features
# cubek-cpu-reference` — cubecl-core/runtime/ir/std and cubecl-wgpu present,
# cubecl-hip and hip-sys absent. What does NOT go away is wgpu: cubecl 0.11's
# manifest defines `test-runtime = ["wgpu"]` and `cubek-test-utils` requires
# test-runtime, so every consumer of the test utilities carries cubecl's wgpu
# backend. That one is portable software with no hardware or SDK requirement,
# unlike the HIP toolchain this edge exists to avoid.
cubecl-ref = { package = "cubecl", version = "0.11.0", default-features = false, optional = true }
wide = { version = "0.7", optional = true }
rayon = { version = "1.10", optional = true }

[dev-dependencies]
# float_roundtrip: correctly-rounded JSON float parsing, so fixture inputs
# are bit-identical to what the NumPy reference computed with (packed
# products are pinned bit-identical, not merely rel 1e-12).
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
