[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "quantibbler-kernels"
version = "0.1.0"
description = "Rust kernels for quantibbler sub-1-bit quantization"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[tool.maturin]
features = ["pyo3/extension-module"]
