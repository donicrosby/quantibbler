# pre-commit gate: run before every commit. Installed via `pre-commit install`.
# Python lint/format runs inside the uv dev environment (uv-managed);
# Rust hooks call cargo directly.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # The chat-template sidecars under tests/fixtures are MODEL DATA: they
      # have to stay byte-identical to the template a real export writes (a
      # stored prompt-format string, whitespace included), so the whitespace
      # hooks must not rewrite them.
      - id: trailing-whitespace
        exclude: ^tests/fixtures/.*/chat_template\.jinja$
      - id: end-of-file-fixer
        exclude: ^tests/fixtures/.*/chat_template\.jinja$
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --manifest-path crates/quantibbler-kernels/Cargo.toml --all -- --check
        language: system
        pass_filenames: false
        files: ^crates/.*\.rs$
      - id: cargo-clippy
        name: cargo clippy -D warnings
        entry: cargo clippy --manifest-path crates/quantibbler-kernels/Cargo.toml --all-targets -- -D warnings
        language: system
        pass_filenames: false
        files: ^crates/.*\.(rs|toml)$
